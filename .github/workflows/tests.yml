name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          # jolt's runtime libraries, plus what libcui needs to build. The suite
          # is headless (bare CUI context, software renderer), so no display.
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 cmake libx11-dev
      - name: Install jolt
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/jolt-lang/jolt/main/install \
            | bash -s -- --dir "$HOME/.jolt"
          echo "$HOME/.jolt" >> "$GITHUB_PATH"
      - name: Cache libcui
        uses: actions/cache@v4
        with:
          path: native/libcui.so
          key: libcui-${{ runner.os }}-a8f71c0-${{ hashFiles('patches/cui-app-wake.patch') }}
      - name: Build libcui (CUI a8f71c0 + wake patch)
        run: JOLT_PWD="$PWD" jolt native
      - name: Test
        run: JOLT_PWD="$PWD" jolt -M:test
